name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mainnet-address-review:
    name: Mainnet address PR review rule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce mainnet address review rule
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          ADDRESSES_FILE="config/addresses.json"

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "Not a pull_request event; skipping mainnet address review gate."
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}:${ADDRESSES_FILE}" 2>/dev/null; then
            echo "No ${ADDRESSES_FILE} at base; nothing to compare."
            exit 0
          fi

          if ! git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- "${ADDRESSES_FILE}"; then
            echo "Detected changes to ${ADDRESSES_FILE}."

            # Fail closed: mainnet address changes require an explicit review marker.
            # The marker is a PR label 'mainnet-address-reviewed' set by a maintainer
            # after the mainnet address review rule has been satisfied.
            if ! echo ",${PR_LABELS}," | grep -q ",mainnet-address-reviewed,"; then
              echo "::error::Mainnet address review rule violated: ${ADDRESSES_FILE} changed without the 'mainnet-address-reviewed' label. See SECURITY.md and docs/rollback-guide.md."
              exit 1
            fi

            echo "Mainnet address review marker present; change permitted."
          else
            echo "No changes to ${ADDRESSES_FILE}; mainnet address review rule not triggered."
          fi
